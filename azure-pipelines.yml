trigger:
  - main

pool:
  name: Default

stages:
  - stage: inittoapplystage
    displayName: Init to Apply

    jobs:
      - job: inittoplanjob
        displayName: Init to Apply

        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/nimakumari.axion-aks-cluster-infra'
              backendServiceArm: 'bhakuaservice'
              backendAzureRmStorageAccountName: 'stogeterra123'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/nimakumari.axion-aks-cluster-infra'
              environmentServiceNameAzureRM: 'bhakuaservice'

          - task: TerraformTask@5
            displayName: Terraform Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/nimakumari.axion-aks-cluster-infra'
              environmentServiceNameAzureRM: 'bhakuaservice'